# Render blueprint.
#
#   render up          # create/update everything from this file
#
# The bot is a long-polling Telegram client: it makes an outbound connection
# and never needs inbound traffic. `serve` also binds $PORT and answers
# /healthz and /readyz, so a Web Service works.
#
# STORAGE -- since the Postgres backend landed, this blueprint uses the FREE
# plan with NO disk: the ledger and the white-label registry live in Postgres
# (Supabase) via DATABASE_URL. Persistent data no longer depends on Render's
# filesystem at all, so the free tier's wiped-on-deploy container is
# irrelevant to money records. If you would rather keep sqlite, use the
# starter plan with a persistent disk and set LEDGER_PATH/SUBBOTS_PATH there.

services:
  - type: web
    name: uotpbot
    runtime: python
    plan: free
    region: singapore          # same region as the Supabase project
    pythonVersion: "3.11.9"    # known-good on Render; project needs >=3.10
    # `[telegram,postgres]` matters: python-telegram-bot and psycopg are
    # optional extras, and a bare `pip install .` starts an HTTP server that
    # accepts no orders and cannot reach Postgres.
    buildCommand: pip install --upgrade pip && pip install ".[telegram,postgres]"
    startCommand: python -m uotpbot serve
    # Liveness, not readiness: a provider outage must not get the process
    # killed and restarted, because a restart mid-order is how you charge a
    # customer and deliver nothing. /readyz reports the outage instead.
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # --- secrets: set via `render up` prompt or the dashboard ----------
      # Supabase pooler URL. Use the SESSION pooler (port 5432): the direct
      # db.<ref>.supabase.co host is IPv6-only (unreachable from Render), and
      # the transaction pooler (6543) disables features for no benefit here --
      # psycopg prepared statements are already switched off in pgstore.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: uotp
      - key: UOTP_API_KEY
        sync: false          # set once; never commit a key
      - key: UOTP_BASE_URL
        value: https://uotp.store/api/stubs/handler_api.php
      # Verified live 2026-09-02: country 0 passes validation, operator must
      # be a numeric id >= 2; the provider then answered NO_CONNECTION (its
      # own backend), which the app reports as provider-down, not a crash.
      - key: UOTP_PRICES_COUNTRY
        value: "0"
      - key: UOTP_PRICES_OPERATOR
        value: "2"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      # --- white-label sub-bots -----------------------------------------
      # Off by default. With DATABASE_URL set, sub-bot records live in
      # Postgres alongside the ledger, so no SUBBOTS_PATH is needed.
      - key: WHITELABEL_ENABLED
        value: "false"
      # The platform's cut of an own-API sub-bot sale, as a fraction of
      # gross -- disclosed to the owner at creation and stored per sub-bot.
      # Out-of-range values fail at startup rather than mid-sale.
      - key: PLATFORM_FEE_RATE
        value: "0.05"
      # Payment-gateway settings: placeholders, set yours before opening up.
      - key: FEE_GATEWAY_RATE
        value: "0.02"
      - key: FEE_GATEWAY_FIXED
        value: "0"
      - key: FEE_GST_RATE
        value: "0"
      - key: PRICING_STRATEGY
        value: "exact_markup"
      - key: PRICING_MARKUP_RATE
        value: "0.45"
      - key: ENGINE_RETRY_CAP
        value: "3"
      - key: ENGINE_POLL_MODE
        value: "adaptive"
      - key: RATE_LIMIT_MAX_BUYS
        value: "3"
      - key: RATE_LIMIT_WINDOW
        value: "30"
      - key: WALLET_MONITOR_SECONDS
        value: "120"
